# ─── JDK Pin ──────────────────────────────────────────────────────────────────
# PERMANENT: Always build with Java 17 LTS (Temurin).
# Root cause of build failures: Java 21+ broke AGP's JdkImageTransform (jlink).
# Java 17 is the official Flutter + AGP 9.x recommended LTS (supported until 2029).
# Install: brew install --cask temurin@17
# CI: set JAVA_HOME to /Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
# To override locally (different OS/path) use ~/.gradle/gradle.properties ONLY.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

# ─── JVM Build Args ───────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ─── Build Performance ────────────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─── Android ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
